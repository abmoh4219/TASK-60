# =============================================================================
# RailOps — docker compose up --build
#
# Services (default profile):
#   db      — PostgreSQL 16 (persistent data volume)
#   app     — Actix-web backend + Yew frontend (persistent uploads + certs volumes)
#
# Services (test profile — run via `docker compose --profile test run --rm tester`):
#   tester  — cargo test runner; targets the live `app` service at https://localhost:8443
#
# No .env file is used.  All configuration is declared inline below.
# Change SESSION_SECRET and ADMIN_SEED_PASSWORD before any production deployment.
#
# Note: network_mode: host is used so both services share the host network,
# bypassing Docker bridge routing (which requires the br_netfilter kernel
# module).  The db container uses port 5433 (instead of the default 5432) to
# avoid conflicting with any local PostgreSQL installation on the host.
#
# Access the app at: https://localhost:8443
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB:       railops
      POSTGRES_USER:     railops
      POSTGRES_PASSWORD: railops_dev_secret_2024   # change in production
      PGPORT:            "5433"                    # avoid conflict with host postgres on 5432
    command: postgres -p 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railops -d railops -p 5433"]
      interval:     5s
      timeout:      5s
      retries:      12
      start_period: 10s

  # ── Application (backend API + Yew frontend) ────────────────────────────────
  app:
    build:
      context:    .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Server
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8443"
      STATIC_DIR:  "/app/static"

      # Database — 127.0.0.1 + port 5433 (host-networked container postgres)
      DB_HOST:            127.0.0.1
      DB_PORT:            "5433"
      DB_NAME:            railops
      DB_USER:            railops
      DB_PASSWORD:        railops_dev_secret_2024   # must match POSTGRES_PASSWORD above
      DB_MAX_CONNECTIONS: "20"

      # TLS  (self-signed cert generated automatically on first boot via rcgen)
      TLS_CERT_PATH: /app/certs/cert.pem
      TLS_KEY_PATH:  /app/certs/key.pem

      # Security  — CHANGE THESE IN PRODUCTION
      SESSION_SECRET:       "change_this_to_a_random_64_char_string_before_going_live_!!1"
      ADMIN_SEED_PASSWORD:  "AdminRailOps2024!"   # used once; update admin pw after first login

      # Logging
      RUST_LOG: "backend=info,actix_web=info,sqlx=warn"

    volumes:
      # Uploaded credential documents, drawn signatures, watermarked PDFs
      - uploads_data:/app/uploads
      # TLS certificate + key (generated once, persisted across restarts)
      - tls_certs:/app/certs

    healthcheck:
      # curl is installed in the runtime image (see Dockerfile runtime stage).
      # -k accepts the self-signed cert; -sf fails silently on HTTP errors.
      test: ["CMD", "curl", "-k", "-sf", "https://localhost:8443/health"]
      interval:     15s
      timeout:      10s
      retries:       5
      start_period: 60s   # allow time for first-boot migration + admin seed

  # ── Test runner (cargo test suite) ─────────────────────────────────────────
  # Only activated with:  docker compose --profile test run --rm tester
  # Inherits the full Rust toolchain from the backend-builder Docker stage.
  # Connects to `app` on localhost (host network mode).
  tester:
    build:
      context:    .
      dockerfile: Dockerfile
      target:     tester        # Uses the dedicated tester stage (has cargo + curl)
    network_mode: host
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Integration tests read this to form request URLs.
      TEST_BASE_URL: "https://localhost:8443"
      # Silence noisy sqlx / actix logs during test compilation.
      RUST_LOG:      "off"
    # Three test suites run in sequence:
    #   1. Backend unit tests  (crypto, pipeline — no DB required)
    #   2. Shared utility tests (QualityScore, PaginationParams, mask_phone)
    #   3. API integration tests (real HTTP to live app, real PostgreSQL)
    command: >
      sh -c "set -e;
        echo '';
        echo '╔══════════════════════════════════════════════╗';
        echo '║  RailOps — Docker Test Suite                 ║';
        echo '╚══════════════════════════════════════════════╝';
        echo '';
        echo '── [1/3] Backend unit tests ──────────────────────';
        cargo test --bin backend -p backend -- --nocapture;
        echo '';
        echo '── [2/3] Shared / frontend utility tests ─────────';
        cargo test -p shared -- --nocapture;
        echo '';
        echo '── [3/3] API integration tests ───────────────────';
        cargo test --test api_integration_test -p backend -- --nocapture;
        echo '';
        echo '══ All tests passed ══════════════════════════════'"
    profiles:
      - test

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  tls_certs:
    driver: local
